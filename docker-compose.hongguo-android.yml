# 可选覆盖文件：与现有任一 Compose 一起使用，详见 docs/hongguo-android.md。
services:
  mediastation-go:
    image: mediastation-go:hongguo-android-local
    pull_policy: never
    build:
      context: .
      target: runtime-android
    platform: linux/amd64
    environment:
      MEDIASTATION_HONGGUO_ANDROID_ADB: hongguo-android:5555
    depends_on:
      hongguo-android:
        condition: service_healthy

  hongguo-android:
    image: redroid/redroid@sha256:11d58a64bfbde2253d1cce81bff409ff58174980222d1bada232d9ef59181191
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    cpus: 4
    mem_limit: 4g
    pids_limit: 4096
    volumes:
      - hongguo-android-data:/data
    # ADB 仅在 Compose 网络中提供，不映射宿主机或公网端口。
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=20
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=true
    healthcheck:
      test: ["CMD", "/system/bin/sh", "-c", "test \"$(/system/bin/getprop sys.boot_completed)\" = 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hongguo-android-data:
