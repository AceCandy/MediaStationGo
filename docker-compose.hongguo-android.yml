# 可选覆盖文件：与现有任一 Compose 一起使用，详见 docs/hongguo-android.md。
services:
  mediastation-go:
    image: mediastation-go:hongguo-android-local
    pull_policy: never
    build:
      context: .
      target: runtime-android
    platform: linux/amd64
    environment:
      MEDIASTATION_HONGGUO_ANDROID_ADB: hongguo-android:5555
    depends_on:
      hongguo-android:
        condition: service_healthy

  hongguo-android:
    image: redroid/redroid@sha256:11d58a64bfbde2253d1cce81bff409ff58174980222d1bada232d9ef59181191
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    cpus: 4
    mem_limit: 4g
    pids_limit: 4096
    volumes:
      - hongguo-android-data:/data
    # ADB 仅在 Compose 网络中提供，不映射宿主机或公网端口。
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=20
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=true
    healthcheck:
      # 已确认的 lmkd 事件计数异常会阻塞系统；只恢复该服务，不重启 Android 或删除数据。
      test:
        - CMD
        - /system/bin/sh
        - -c
        - |
          test "$$(getprop sys.boot_completed)" = 1 || exit 1
          pid="$$(getprop init.svc_debug_pid.lmkd)"
          case "$$pid" in ''|*[!0-9]*) exit 1 ;; esac
          errors="$$(logcat -b main -d -t 100 --pid="$$pid" -s lowmemorykiller:E 2>/dev/null)" || exit 1
          case "$$errors" in
            *'epoll_wait failed (errno=22)'*) setprop ctl.restart lmkd; exit 1 ;;
          esac
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hongguo-android-data:
