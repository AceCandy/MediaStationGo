# 独立常驻 Android；本文件不启动 MediaStationGo。
# 启动：docker compose -f docker-compose.hongguo-android-standalone.yml up -d --wait
# 需要 Linux amd64、binder 内核支持；首次 App 初始化见 docs/hongguo-android.md。
name: hongguo-android

services:
  hongguo-android:
    image: redroid/redroid@sha256:11d58a64bfbde2253d1cce81bff409ff58174980222d1bada232d9ef59181191
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    cpus: 4
    mem_limit: 4g
    pids_limit: 4096
    ports:
      # 同机运行 dev.sh 时保持此配置。
      # 跨机器访问：将127.0.0.1改为模拟器宿主机的可信内网IP。
      # 左侧15555为可修改的宿主端口，右侧5555保持不变；勿暴露公网。
      - "127.0.0.1:15555:5555"
    volumes:
      - hongguo-android-data:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_fps=20
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=true
    healthcheck:
      test: ["CMD", "/system/bin/sh", "-c", "test \"$(/system/bin/getprop sys.boot_completed)\" = 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hongguo-android-data:
